[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "berkeley-humanoid-lite-motion"
version = "0.1.0"
description = "Capture-to-robot motion retargeting and augmentation for Berkeley Humanoid Lite"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["berkeley_humanoid_lite_motion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
