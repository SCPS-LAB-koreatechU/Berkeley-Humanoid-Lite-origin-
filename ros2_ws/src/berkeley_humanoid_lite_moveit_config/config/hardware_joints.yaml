# Maps MoveIt joint names onto real actuators.
#
# ========================= NOTHING HERE IS VERIFIED =========================
# `direction` and `offset` are transcribed from robot/bimanual.py, which
# describes a *different* robot: its five joints per arm are named
# shoulder_pitch/roll/yaw, elbow and wrist_yaw, and this URDF's are
# shoulder_pitch/roll/yaw, elbow_pitch and elbow_roll. The CAN IDs line up by
# position in the chain; the sign conventions have NOT been checked against
# this URDF.
#
# Verify one joint at a time, powered, with the arm free to move and a hand on
# the E-STOP:
#   1. bring the joint up with `enabled: false` still set and watch /joint_states
#      while you back-drive it by hand -- the sign tells you `direction`
#   2. only then set `enabled: true` and command small moves
# ============================================================================
#
# `enabled: false` means the bridge will read the joint if it answers but will
# never command it. Joints absent from this file are neither read nor commanded;
# the bridge reports them as unavailable and refuses trajectories touching them.

bus:
  # Two CAN channels, one per arm, as in robot/bimanual.py.
  left: can0
  right: can1

# Applied to every enabled joint at enable time. Deliberately below the
# firmware defaults in motor_configuration.json (torque_limit 0.8).
gains:
  position_kp: 0.7
  position_kd: 0.03
  torque_limit: 0.5

safety:
  # Commanded target cannot move faster than this, no matter what the
  # trajectory asks for. A yanked goal becomes a ramp, not a step.
  max_joint_speed: 1.0        # [rad/s]
  # Consecutive missed PDO replies before the goal freezes in place.
  link_flaky_cycles: 5
  # ... and before the joint is auto-disabled and must be re-enabled by hand.
  pdo_loss_threshold: 100
  # Commands are clamped into the URDF limits shrunk by this margin, so a
  # trajectory that grazes a limit cannot drive the joint into its hard stop.
  limit_margin: 0.05          # [rad]
  control_rate_hz: 100.0

joints:
  # --- left arm ------------------------------------------------------------
  # Motors 1, 3 and 5 are the ones actually calibrated and bench-tested.
  arm_left_shoulder_pitch_joint:
    bus: left
    device_id: 1
    direction: +1
    offset: 0.0
    enabled: true
  arm_left_shoulder_roll_joint:
    bus: left
    device_id: 3
    direction: +1
    offset: 0.0
    enabled: true
  arm_left_shoulder_yaw_joint:
    bus: left
    device_id: 5
    direction: -1
    offset: 0.0
    enabled: true

  # Elbow motors are not fitted yet. Listed so the mapping is visible, disabled
  # so the bridge cannot command them.
  arm_left_elbow_pitch_joint:
    bus: left
    device_id: 7
    direction: -1
    offset: 0.0
    enabled: false
  arm_left_elbow_roll_joint:
    bus: left
    device_id: 9
    direction: -1
    offset: 0.0
    enabled: false

  # --- right arm -----------------------------------------------------------
  # No right-arm motor has been calibrated. All disabled.
  arm_right_shoulder_pitch_joint:
    bus: right
    device_id: 2
    direction: -1
    offset: 0.0
    enabled: false
  arm_right_shoulder_roll_joint:
    bus: right
    device_id: 4
    direction: +1
    offset: 0.0
    enabled: false
  arm_right_shoulder_yaw_joint:
    bus: right
    device_id: 6
    direction: -1
    offset: 0.0
    enabled: false
  arm_right_elbow_pitch_joint:
    bus: right
    device_id: 8
    direction: +1
    offset: 0.0
    enabled: false
  arm_right_elbow_roll_joint:
    bus: right
    device_id: 10
    direction: -1
    offset: 0.0
    enabled: false

# The V1 wrist runs Feetech SCS2332/SCS15 serial servos, not recoil CAN, and
# the hardware is not built yet. Left empty on purpose: the bridge treats these
# joints as unavailable and rejects any trajectory that includes them.
wrist_servos: {}

# The hands are NOT handled by this bridge. dexhand_bringup's `dexhand_driver`
# already exposes hand_controller/follow_joint_trajectory over its serial link
# and uses the same R_<finger>_<Yaw|Pitch> joint names this URDF does, so MoveIt
# talks to it directly -- see moveit_controllers_hardware.yaml.
#
# Its servo output starts disabled; turn it on deliberately with
#   ros2 service call /dexhand_driver/enable std_srvs/srv/SetBool '{data: true}'
