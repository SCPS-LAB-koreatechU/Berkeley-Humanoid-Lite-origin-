# Arm caps as in joint_limits.yaml, plus the DexHand fingers.
#
# The URDF declares velocity="15" rad/s for every arm joint, which is the
# actuator's no-load figure rather than anything you would command. The finger
# limits come from the DexHand URDF (3.0 rad/s) and are kept as-is; those servos
# really are that quick over their short travel.

default_velocity_scaling_factor: 0.5
default_acceleration_scaling_factor: 0.5

joint_limits:
  arm_left_shoulder_pitch_joint: &arm_limits
    has_velocity_limits: true
    max_velocity: 2.0
    has_acceleration_limits: true
    max_acceleration: 4.0
  arm_left_shoulder_roll_joint: *arm_limits
  arm_left_shoulder_yaw_joint: *arm_limits
  arm_left_elbow_pitch_joint: *arm_limits
  arm_left_elbow_roll_joint: *arm_limits
  arm_right_shoulder_pitch_joint: *arm_limits
  arm_right_shoulder_roll_joint: *arm_limits
  arm_right_shoulder_yaw_joint: *arm_limits
  arm_right_elbow_pitch_joint: *arm_limits
  arm_right_elbow_roll_joint: *arm_limits

  R_Index_Pitch: &finger_limits
    has_velocity_limits: true
    max_velocity: 3.0
    has_acceleration_limits: true
    max_acceleration: 10.0
  R_Middle_Pitch: *finger_limits
  R_Ring_Pitch: *finger_limits
  R_Pinky_Pitch: *finger_limits
  R_Index_Yaw: *finger_limits
  R_Middle_Yaw: *finger_limits
  R_Ring_Yaw: *finger_limits
  R_Pinky_Yaw: *finger_limits
