# Each arm is a 5-DOF chain, so a full 6-DOF pose goal is unreachable in
# general: with five joints you can pick a position or an orientation, not both.
# position_only_ik tells the KDL solver to drive the position error to zero and
# ignore orientation, which is what makes the RViz interactive marker usable.
#
# Set position_only_ik to false if you ever add a wrist joint (or want to solve
# for orientation and accept that most goals will fail).
#
# `both_arms` has two tips and therefore no IK solver; plan for it in joint
# space, or plan for one arm at a time.

left_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  position_only_ik: true

right_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  position_only_ik: true
