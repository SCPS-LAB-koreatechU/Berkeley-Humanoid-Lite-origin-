# Full 6-DOF pose IK, unlike the other models.
#
# Each arm here is 9 DOF: shoulder pitch/roll/yaw, elbow pitch/roll, then the V1
# wrist's axial rotation plus two pitch joints and a yaw joint. Nine exceeds the
# six a pose needs, so position_only_ik is off and goal orientation in RViz is
# finally respected -- the rotation rings on the interactive marker do something.
#
# The redundancy also means many joint configurations reach the same pose; KDL
# returns whichever one it converges to from the seed.

right_arm: &arm
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  position_only_ik: false

left_arm: *arm
